<!doctype html>
<!-- 中文注释：
  本文件用途：2023-project-note 项目的自包含交互动画。
  内容：合成数据的 bootstrap 直方图。两个滑块控制"重采样次数"和"样本量"，
  用来演示均值的重采样分布如何变窄。
  维护要点：
  1) 固定随机种子 → 每次打开结果一致，且与任何真实数据无关。
  2) 零外部依赖 / 零网络请求；canvas 响应式；prefers-reduced-motion 下关闭过渡。
  3) 计算量做上限保护（最多 4000 次重采样），避免在手机上卡顿。
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive figure: bootstrap distribution of a mean estimate</title>
  <meta name="robots" content="noindex">
  <style>
    /* 中文注释：动画页自有样式 */
    :root {
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --link: #1a5fb4;
      --bg: #ffffff;
      --panel: #f8f9fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 12px;
    }
    h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
    .layout { flex: 1 1 auto; display: flex; gap: 12px; min-height: 0; }
    .plot { flex: 1 1 auto; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .controls {
      flex: 0 0 210px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      padding: 10px;
      overflow: auto;
    }
    label { display: block; font-size: 12px; margin: 0 0 2px; }
    input[type="range"] { width: 100%; margin: 0 0 12px; accent-color: var(--link); }
    .readout { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
    .readout span { font-variant-numeric: tabular-nums; color: var(--text); }
    .hint { font-size: 11.5px; color: var(--muted); margin: 12px 0 0; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    @media (max-width: 640px) {
      .layout { flex-direction: column; }
      .controls { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <h1>Resampling distribution of a mean</h1>

  <div class="layout">
    <div class="plot">
      <canvas id="plot" role="img"
              aria-label="Histogram of resampled means, narrowing as the number of resamples and the sample size increase."></canvas>
    </div>

    <div class="controls">
      <p class="readout">
        Resampled-mean spread<br>
        <span id="spread">&#8212;</span>
      </p>

      <label for="resamples">Resamples: <span id="resamples-value">600</span></label>
      <input type="range" id="resamples" min="100" max="4000" step="100" value="600">

      <label for="samples">Sample size per run: <span id="samples-value">50</span></label>
      <input type="range" id="samples" min="10" max="400" step="10" value="50">

      <p class="hint">
        Synthetic samples from a fixed distribution, generated with a fixed seed
        inside this figure. Nothing here is derived from project data.
      </p>
    </div>
  </div>

  <script>
    // 中文注释：
    // 自包含逻辑。MOCK 分布：均值 0、标准差 1 的近似正态样本（合成）。
    // 通过固定种子保证每次渲染结果一致，便于读者对照。
    (function () {
      'use strict';

      var MAX_RESAMPLES = 4000;

      // 中文注释：固定种子的伪随机数生成器（mulberry32）
      function makeRng(seed) {
        var t = seed >>> 0;
        return function () {
          t = (t + 0x6D2B79F5) >>> 0;
          var r = Math.imul(t ^ (t >>> 15), 1 | t);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 中文注释：生成 n 个合成观测值
      function makeSample(rng, n) {
        var out = new Array(n);
        for (var i = 0; i < n; i++) {
          var u1 = Math.max(rng(), 1e-9);
          var u2 = rng();
          out[i] = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        }
        return out;
      }

      // 中文注释：对样本做 bootstrap，返回重采样均值的数组
      function bootstrapMeans(rng, sample, count) {
        var n = sample.length;
        var means = new Array(count);
        var sum, idx;
        for (var k = 0; k < count; k++) {
          sum = 0;
          for (var i = 0; i < n; i++) {
            idx = Math.floor(rng() * n);
            if (idx >= n) { idx = n - 1; }
            sum += sample[idx];
          }
          means[k] = sum / n;
        }
        return means;
      }

      // 中文注释：样本标准差，用于读数
      function stdev(values) {
        var n = values.length;
        if (n < 2) { return 0; }
        var mean = 0, i;
        for (i = 0; i < n; i++) { mean += values[i]; }
        mean /= n;
        var acc = 0;
        for (i = 0; i < n; i++) {
          var d = values[i] - mean;
          acc += d * d;
        }
        return Math.sqrt(acc / (n - 1));
      }

      var canvas = document.getElementById('plot');
      var ctx = canvas.getContext('2d');
      var spreadEl = document.getElementById('spread');
      var resamplesInput = document.getElementById('resamples');
      var samplesInput = document.getElementById('samples');
      var resamplesValue = document.getElementById('resamples-value');
      var samplesValue = document.getElementById('samples-value');

      var reduceMotion = window.matchMedia
        ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
        : false;

      var currentMeans = null;

      // 中文注释：重新计算并绘制。每次参数变化都重算，但用固定种子保证可复现。
      function compute() {
        var resamples = Math.min(MAX_RESAMPLES, Number(resamplesInput.value));
        var sampleSize = Number(samplesInput.value);

        resamplesValue.textContent = String(resamples);
        samplesValue.textContent = String(sampleSize);

        var rng = makeRng(1234567 + sampleSize * 31 + resamples);
        var sample = makeSample(rng, sampleSize);
        currentMeans = bootstrapMeans(rng, sample, resamples);

        var sd = stdev(currentMeans);
        spreadEl.textContent = sd.toFixed(4) + '  (n = ' + resamples + ')';

        var rect = canvas.parentNode.getBoundingClientRect();
        draw(rect.width, rect.height);
      }

      // 中文注释：按 devicePixelRatio 设置 canvas 尺寸，保证高清与响应式
      function resize() {
        var rect = canvas.parentNode.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(320, Math.round(rect.width * dpr));
        canvas.height = Math.max(180, Math.round(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw(rect.width, rect.height);
      }

      // 中文注释：直方图绘制
      function draw(w, h) {
        ctx.clearRect(0, 0, w, h);
        if (!currentMeans || !currentMeans.length) { return; }

        var means = currentMeans;
        var n = means.length;
        var lo = Infinity, hi = -Infinity, sum = 0, i;
        for (i = 0; i < n; i++) {
          if (means[i] < lo) { lo = means[i]; }
          if (means[i] > hi) { hi = means[i]; }
          sum += means[i];
        }
        var mean = sum / n;
        var pad = (hi - lo) * 0.12 || 0.01;
        lo -= pad; hi += pad;

        var bins = 34;
        var counts = new Array(bins);
        for (i = 0; i < bins; i++) { counts[i] = 0; }
        for (i = 0; i < n; i++) {
          var b = Math.floor(((means[i] - lo) / (hi - lo)) * bins);
          if (b < 0) { b = 0; }
          if (b >= bins) { b = bins - 1; }
          counts[b] += 1;
        }
        var maxCount = 0;
        for (i = 0; i < bins; i++) { if (counts[i] > maxCount) { maxCount = counts[i]; } }

        var m = { l: 40, r: 12, t: 12, b: 34 };
        var pw = Math.max(60, w - m.l - m.r);
        var ph = Math.max(60, h - m.t - m.b);
        var barW = pw / bins;

        // 中文注释：网格与刻度
        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        ctx.font = '11px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.fillStyle = '#6b7280';
        for (i = 0; i <= 4; i++) {
          var gy = m.t + (ph * i) / 4;
          ctx.beginPath(); ctx.moveTo(m.l, gy); ctx.lineTo(m.l + pw, gy); ctx.stroke();
          ctx.textAlign = 'right';
          ctx.fillText(String(Math.round((maxCount * (4 - i)) / 4)), m.l - 6, gy + 3);
        }

        // 中文注释：直方柱
        for (i = 0; i < bins; i++) {
          if (counts[i] === 0) { continue; }
          var bh = (counts[i] / maxCount) * ph;
          var bx = m.l + i * barW;
          ctx.fillStyle = '#1a5fb4';
          ctx.fillRect(bx + 0.5, m.t + ph - bh, Math.max(1, barW - 1), bh);
        }

        // 中文注释：坐标轴
        ctx.strokeStyle = '#1f2328';
        ctx.beginPath();
        ctx.moveTo(m.l, m.t);
        ctx.lineTo(m.l, m.t + ph);
        ctx.lineTo(m.l + pw, m.t + ph);
        ctx.stroke();

        // 中文注释：均值参考线
        var mx = m.l + ((mean - lo) / (hi - lo)) * pw;
        ctx.strokeStyle = '#6b7280';
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(mx, m.t); ctx.lineTo(mx, m.t + ph); ctx.stroke();
        ctx.setLineDash([]);

        // 中文注释：横轴标签
        ctx.fillStyle = '#6b7280';
        ctx.textAlign = 'left';
        ctx.fillText(lo.toFixed(2), m.l, m.t + ph + 14);
        ctx.textAlign = 'right';
        ctx.fillText(hi.toFixed(2), m.l + pw, m.t + ph + 14);
        ctx.textAlign = 'center';
        ctx.fillText('resampled mean  (synthetic units)', m.l + pw / 2, h - 4);
      }

      // 中文注释：事件绑定（不使用内联 onclick）
      resamplesInput.addEventListener('input', compute);
      samplesInput.addEventListener('input', compute);
      window.addEventListener('resize', resize);

      compute();
      // 中文注释：容器尺寸在首帧可能还未稳定，下一帧再校准一次
      window.requestAnimationFrame(resize);
    })();
  </script>
</body>
</html>
