<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"
     aria-labelledby="fig1-title fig1-desc" width="720" height="420">
  <title id="fig1-title">Schematic scaling collapse</title>
  <desc id="fig1-desc">Illustrative plot showing measurements at three system sizes plotted against a scaled variable so that they overlap, with an inset showing the raw size dependence. All values are synthetic.</desc>

  <!-- 中文注释：
       这是一个纯 SVG 占位/示意图，不含任何真实数据。
       用途：项目详情页的 Figure 1。替换真实图时，保持文件名一致最省事。
       字体使用系统字体栈，与全站一致。
  -->
  <style>
    /* 中文注释：SVG 内部样式，颜色与全站 CSS 变量保持一致 */
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #1f2328; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2 4; }
    .tick { stroke: #6b7280; stroke-width: 1; }
    .lbl { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 13px; fill: #1f2328; }
    .lbl-s { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 11px; fill: #6b7280; }
    .axis-title { font-family: Georgia, "Times New Roman", serif; font-size: 13px; fill: #1f2328; }
    .series-a { fill: #1a5fb4; }
    .series-b { fill: #6b7280; }
    .series-c { fill: #1f2328; }
    .err { stroke: #6b7280; stroke-width: 1; }
    .fitline { fill: none; stroke: #1a5fb4; stroke-width: 1.5; }
    .inset-panel { fill: #f8f9fa; stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="420"/>

  <!-- 中文注释：主图框 -->
  <rect class="frame" x="72" y="40" width="480" height="300" rx="6"/>

  <!-- 中文注释：网格线与刻度 -->
  <g>
    <line class="grid" x1="72" y1="100" x2="552" y2="100"/>
    <line class="grid" x1="72" y1="160" x2="552" y2="160"/>
    <line class="grid" x1="72" y1="220" x2="552" y2="220"/>
    <line class="grid" x1="72" y1="280" x2="552" y2="280"/>
    <line class="grid" x1="168" y1="40" x2="168" y2="340"/>
    <line class="grid" x1="264" y1="40" x2="264" y2="340"/>
    <line class="grid" x1="360" y1="40" x2="360" y2="340"/>
    <line class="grid" x1="456" y1="40" x2="456" y2="340"/>
  </g>

  <!-- 中文注释：坐标轴 -->
  <line class="axis" x1="72" y1="340" x2="552" y2="340"/>
  <line class="axis" x1="72" y1="40" x2="72" y2="340"/>

  <!-- 中文注释：刻度标签（故意使用通用符号，不含真实数值） -->
  <g class="lbl-s">
    <text x="72" y="358">0</text>
    <text x="168" y="358">0.25</text>
    <text x="264" y="358">0.5</text>
    <text x="360" y="358">0.75</text>
    <text x="456" y="358">1.0</text>
    <text x="520" y="358">&gt;</text>
  </g>
  <g class="lbl-s" text-anchor="end">
    <text x="64" y="344">0</text>
    <text x="64" y="284">0.25</text>
    <text x="64" y="224">0.5</text>
    <text x="64" y="164">0.75</text>
    <text x="64" y="104">1.0</text>
  </g>

  <!-- 中文注释：拟合线（示意） -->
  <path class="fitline" d="M96 322 L150 300 L210 272 L276 240 L348 204 L420 166 L486 130 L540 102"/>

  <!-- 中文注释：三组"不同 system size"的合成数据点，带示意误差棒 -->
  <g>
    <line class="err" x1="120" y1="302" x2="120" y2="316"/>
    <circle class="series-a" cx="120" cy="309" r="3.5"/>
    <line class="err" x1="204" y1="262" x2="204" y2="276"/>
    <circle class="series-a" cx="204" cy="269" r="3.5"/>
    <line class="err" x1="288" y1="226" x2="288" y2="240"/>
    <circle class="series-a" cx="288" cy="233" r="3.5"/>
    <line class="err" x1="372" y1="188" x2="372" y2="202"/>
    <circle class="series-a" cx="372" cy="195" r="3.5"/>
    <line class="err" x1="456" y1="150" x2="456" y2="164"/>
    <circle class="series-a" cx="456" cy="157" r="3.5"/>
  </g>
  <g>
    <line class="err" x1="150" y1="290" x2="150" y2="302"/>
    <circle class="series-b" cx="150" cy="296" r="3.5"/>
    <line class="err" x1="234" y1="252" x2="234" y2="264"/>
    <circle class="series-b" cx="234" cy="258" r="3.5"/>
    <line class="err" x1="318" y1="214" x2="318" y2="226"/>
    <circle class="series-b" cx="318" cy="220" r="3.5"/>
    <line class="err" x1="402" y1="178" x2="402" y2="190"/>
    <circle class="series-b" cx="402" cy="184" r="3.5"/>
    <line class="err" x1="486" y1="140" x2="486" y2="152"/>
    <circle class="series-b" cx="486" cy="146" r="3.5"/>
  </g>
  <g>
    <line class="err" x1="180" y1="278" x2="180" y2="290"/>
    <circle class="series-c" cx="180" cy="284" r="3.5"/>
    <line class="err" x1="264" y1="240" x2="264" y2="252"/>
    <circle class="series-c" cx="264" cy="246" r="3.5"/>
    <line class="err" x1="348" y1="202" x2="348" y2="214"/>
    <circle class="series-c" cx="348" cy="208" r="3.5"/>
    <line class="err" x1="432" y1="166" x2="432" y2="178"/>
    <circle class="series-c" cx="432" cy="172" r="3.5"/>
    <line class="err" x1="516" y1="126" x2="516" y2="138"/>
    <circle class="series-c" cx="516" cy="132" r="3.5"/>
  </g>

  <!-- 中文注释：轴标题 -->
  <text class="axis-title" x="312" y="386" text-anchor="middle">scaled variable  (schematic)</text>
  <text class="axis-title" x="20" y="190" text-anchor="middle" transform="rotate(-90 20 190)">scaled observable</text>

  <!-- 中文注释：图例 -->
  <g>
    <circle class="series-a" cx="596" cy="72" r="4"/>
    <text class="lbl" x="608" y="76">size A</text>
    <circle class="series-b" cx="596" cy="96" r="4"/>
    <text class="lbl" x="608" y="100">size B</text>
    <circle class="series-c" cx="596" cy="120" r="4"/>
    <text class="lbl" x="608" y="124">size C</text>
    <text class="lbl-s" x="596" y="148">Illustrative</text>
    <text class="lbl-s" x="596" y="164">values only</text>
  </g>

  <!-- 中文注释：内嵌小图：原始 size 依赖关系 -->
  <g>
    <rect class="inset-panel" x="588" y="196" width="112" height="112" rx="6"/>
    <line class="axis" x1="600" y1="296" x2="688" y2="296"/>
    <line class="axis" x1="600" y1="208" x2="600" y2="296"/>
    <path class="fitline" d="M604 288 L620 272 L640 256 L660 244 L680 236"/>
    <circle class="series-a" cx="604" cy="288" r="3"/>
    <circle class="series-a" cx="630" cy="264" r="3"/>
    <circle class="series-a" cx="656" cy="248" r="3"/>
    <circle class="series-a" cx="680" cy="236" r="3"/>
    <text class="lbl-s" x="600" y="204">raw trend</text>
    <text class="lbl-s" x="600" y="318" text-anchor="middle" transform="translate(44 0)">system size</text>
  </g>
</svg>
