<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-labelledby="fig2-title fig2-desc" width="720" height="300">
  <title id="fig2-title">Schematic four-stage analysis pipeline</title>
  <desc id="fig2-desc">A diagram of four sequential stages: ingest raw simulation output, validate it against an explicit schema, derive quantities with uncertainties, and render figures from a declarative configuration.</desc>

  <!-- 中文注释：
       纯 SVG 示意图：可复现分析流程的四个阶段。
       不含任何真实数据或代码；替换真实图时保持文件名一致最省事。
  -->
  <style>
    /* 中文注释：与全站配色一致的 SVG 内部样式 */
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .box-em { fill: #f8f9fa; stroke: #1a5fb4; stroke-width: 1; }
    .arrow { stroke: #6b7280; stroke-width: 1.25; fill: none; }
    .title { font-family: Georgia, "Times New Roman", serif; font-size: 14px; fill: #1f2328; }
    .lbl { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 11.5px; fill: #6b7280; }
    .step { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 10.5px; fill: #1a5fb4; }
    .config { fill: #f8f9fa; stroke: #e5e7eb; stroke-width: 1; }
    .configline { stroke: #6b7280; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="300"/>

  <text class="title" x="24" y="36">Analysis pipeline: one entry point, four validated stages</text>

  <!-- 中文注释：四个阶段方框 -->
  <g>
    <rect class="box" x="24" y="72" width="150" height="96" rx="6"/>
    <text class="step" x="36" y="94">1. Ingest</text>
    <text class="lbl" x="36" y="116">Read raw simulation</text>
    <text class="lbl" x="36" y="132">output, unchanged</text>
    <text class="lbl" x="36" y="148">and read-only</text>
  </g>
  <g>
    <rect class="box" x="198" y="72" width="150" height="96" rx="6"/>
    <text class="step" x="210" y="94">2. Validate</text>
    <text class="lbl" x="210" y="116">Check the schema:</text>
    <text class="lbl" x="210" y="132">sizes, columns,</text>
    <text class="lbl" x="210" y="148">units, sample counts</text>
  </g>
  <g>
    <rect class="box-em" x="372" y="72" width="150" height="96" rx="6"/>
    <text class="step" x="384" y="94">3. Derive</text>
    <text class="lbl" x="384" y="116">Compute quantities</text>
    <text class="lbl" x="384" y="132">and keep statistical</text>
    <text class="lbl" x="384" y="148">and systematic apart</text>
  </g>
  <g>
    <rect class="box" x="546" y="72" width="150" height="96" rx="6"/>
    <text class="step" x="558" y="94">4. Render</text>
    <text class="lbl" x="558" y="116">Produce figures and</text>
    <text class="lbl" x="558" y="132">tables, registered in</text>
    <text class="lbl" x="558" y="148">the figure manifest</text>
  </g>

  <!-- 中文注释：阶段之间的箭头 -->
  <g>
    <path class="arrow" d="M174 120 L194 120" marker-end="url(#ah)"/>
    <path class="arrow" d="M348 120 L368 120" marker-end="url(#ah)"/>
    <path class="arrow" d="M522 120 L542 120" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 中文注释：底部说明：单一配置文件驱动全部阶段 -->
  <g>
    <rect class="config" x="24" y="200" width="672" height="40" rx="6"/>
    <text class="lbl" x="36" y="225">One configuration file drives every stage &mdash; fit windows, plot ranges, and output paths are never edited by hand.</text>
  </g>
  <g>
    <path class="configline" d="M99 200 L99 172"/>
    <path class="configline" d="M273 200 L273 172"/>
    <path class="configline" d="M447 200 L447 172"/>
    <path class="configline" d="M621 200 L621 172"/>
    <text class="lbl" x="24" y="264">Each stage can also be re-run on its own, so a single step can be debugged without repeating the whole analysis.</text>
  </g>
</svg>
